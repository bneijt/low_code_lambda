[package]
name = "lcl-event-to-s3"
version = "0.1.0"
edition = "2024"
description = "Write incoming lambda event to S3 as json"
authors = ["Bram Neijt <bram@neijt.nl>"]

[dependencies]
anyhow = "1.0"
async-trait = "0.1.88"
aws-config = "1"
aws-sdk-s3 = "1"
chrono = "0.4.42"
lambda_runtime = "0.13"
serde = "1.0"
serde_json = "1.0.145"
tokio = { version = "1", features = ["macros"] }
tracing-subscriber = "0.3"
